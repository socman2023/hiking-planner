name: Import public LighterPack lists

on:
  push:
    paths:
      - 'scripts/build-lighterpack-seed.mjs'
      - '.github/workflows/import-lighterpack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract four public lists
        run: node scripts/build-lighterpack-seed.mjs
      - name: Publish structured catalogue into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/seed/lighterpack.json
          if git diff --cached --quiet; then
            echo "Catalog already current"
          else
            git commit -m "data: import four LighterPack public lists"
            git push origin HEAD:main
          fi
